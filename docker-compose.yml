# Everything in one command:  docker compose up --build
#   Angular back office:        http://localhost:4200
#   React distributors' portal:  http://localhost:5173
#   API + Swagger:               http://localhost:8080/swagger-ui.html
# Demo users (password demo1234): admin@example.com, marcos.comercial@example.com,
# irene.comercial@example.com, cliente.cantabrico@example.com, cliente.vera@example.com

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: b2b_orders
      POSTGRES_USER: b2b
      POSTGRES_PASSWORD: b2b
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U b2b -d b2b_orders"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/b2b_orders
      DB_USER: b2b
      DB_PASSWORD: b2b
      # Local demo only. Any real environment must set its own secret.
      JWT_SECRET: docker-compose-demo-secret-change-me-0123456789
      SPRING_PROFILES_ACTIVE: demo
      CORS_ALLOWED_ORIGINS: http://localhost:4200,http://localhost:5173
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 3s
      retries: 12

  web-angular:
    build: ./frontend-angular
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_URL: http://api:8080
    ports:
      - "4200:80"

  web-react:
    build: ./frontend-react
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_URL: http://api:8080
    ports:
      - "5173:80"

volumes:
  db-data:
