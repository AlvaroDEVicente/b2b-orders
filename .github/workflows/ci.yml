# Runs on every push and pull request to main.
# Three test jobs run in parallel, so a failure says exactly which part broke;
# the Docker build runs only when all three pass.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Java 21, tests with PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Unit + integration tests. Testcontainers starts PostgreSQL with the runner's Docker.
      - name: Build and test
        run: ./mvnw -B verify

  frontend-angular:
    name: Angular (tests and production build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-angular
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend-angular/package-lock.json
      - run: npm ci
      - run: npm run test:ci
      - run: npx ng build

  frontend-react:
    name: React (lint, tests and production build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-react
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend-angular, frontend-react]
    steps:
      - uses: actions/checkout@v5
      - name: Build every image in docker-compose.yml
        run: docker compose build
